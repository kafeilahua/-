[project]
name = "sc200-study"
version = "0.1.0"
description = "SC-200 bilingual learning platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "argon2-cffi>=23.1", "pydantic>=2.10,<3", "pypdf>=5,<7", "pypdfium2>=4.30", "pdfplumber>=0.11", "httpx>=0.28,<1", "pillow>=11"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
translation = [
    "argostranslate>=1.11.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"tests/test_api.py" = ["E402"]
